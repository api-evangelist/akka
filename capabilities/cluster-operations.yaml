naftiko: "1.0.0-alpha1"
info:
  label: "Akka Cluster Operations"
  description: "Workflow for monitoring and managing Akka cluster operations including health checks, member management, and cluster bootstrap. For platform engineers and SREs operating distributed Akka systems."
  tags:
    - Akka
    - Cluster Management
    - Distributed Systems
    - Operations
    - Health Monitoring
  created: "2026-04-19"
  modified: "2026-04-19"
binds:
  - namespace: env
    keys:
      AKKA_MANAGEMENT_HOST: AKKA_MANAGEMENT_HOST
      AKKA_MANAGEMENT_PORT: AKKA_MANAGEMENT_PORT
capability:
  consumes:
    - import: akka-management
      location: ./shared/akka-management.yaml
  exposes:
    - type: rest
      port: 8080
      namespace: cluster-operations-api
      description: "Unified REST API for Akka cluster operations."
      resources:
        - path: /v1/health
          name: health
          description: "Cluster health checks"
          operations:
            - method: GET
              name: check-alive
              description: "Node liveness check"
              call: "akka-management.check-alive"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: check-ready
              description: "Node readiness check"
              call: "akka-management.check-ready"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cluster/members
          name: cluster-members
          description: "Cluster member management"
          operations:
            - method: GET
              name: list-members
              description: "List cluster members"
              call: "akka-management.list-cluster-members"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: join-member
              description: "Join a cluster member"
              call: "akka-management.join-cluster"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9090
      namespace: cluster-operations-mcp
      transport: http
      description: "MCP server for AI-assisted Akka cluster operations."
      tools:
        - name: check-cluster-health
          description: "Check liveness and readiness of Akka cluster nodes"
          hints:
            readOnly: true
            openWorld: false
          call: "akka-management.check-alive"
          outputParameters:
            - type: object
              mapping: "$."
        - name: check-cluster-readiness
          description: "Check if Akka cluster nodes are ready to serve traffic"
          hints:
            readOnly: true
            openWorld: false
          call: "akka-management.check-ready"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-cluster-members
          description: "List all current members of the Akka cluster"
          hints:
            readOnly: true
            openWorld: false
          call: "akka-management.list-cluster-members"
          outputParameters:
            - type: object
              mapping: "$."
        - name: join-cluster-member
          description: "Add a new node to the Akka cluster"
          hints:
            readOnly: false
            destructive: false
          call: "akka-management.join-cluster"
          with:
            address: "tools.address"
          outputParameters:
            - type: object
              mapping: "$."
