openapi: 3.0.3
info:
  title: Akka Management Bootstrap API
  description: REST API provided by Akka Management for cluster health checks, membership management, and cluster bootstrap operations.
  version: 1.0.0
  contact:
    name: Akka
    url: https://doc.akka.io/docs/akka-management/current/
  license:
    name: Business Source License 1.1
    url: https://akka.io/license/
servers:
- url: http://localhost:8558
  description: Default Akka Management HTTP endpoint
tags:
- name: Bootstrap
  description: Cluster bootstrap discovery endpoints.
paths:
  /bootstrap/seed-nodes:
    get:
      operationId: getSeedNodes
      summary: Akka Get Bootstrap Seed Nodes
      description: Returns the seed nodes discovered during cluster bootstrap.
      tags:
      - Bootstrap
      responses:
        '200':
          description: Seed nodes list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seedNodes:
                    type: array
                    items:
                      type: string
