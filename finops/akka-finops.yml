meters:
  - name: per_core_year
    description: Annual per-core licensing for self-managed Akka SDK and Akka Libraries
    unit: core-year
    aggregation: sum
    dimensions:
      - product
      - cluster
      - environment
  - name: akka_hours
    description: Hourly compute metering for Akka Serverless
    unit: akka-hour
    aggregation: sum
    dimensions:
      - service
      - region
      - environment
  - name: per_region_year
    description: Annual per-region subscription for Akka in Your VPC deployments
    unit: region-year
    aggregation: sum
    dimensions:
      - region
      - cloud
  - name: committed_spend
    description: Committed-use spend tracked against multi-cloud credit pool
    unit: USD
    aggregation: sum
    dimensions:
      - cloud
      - product
principles:
  - name: Visibility
    description: Track Akka Serverless consumption via the Akka console and per-tenant Akka-hour reports.
      Self-managed deployments correlate cost to provisioned cores via license inventories.
  - name: Allocation
    description: Tag Akka Serverless services and Akka in-VPC regions by team, environment, and product
      so per-core and per-Akka-hour spend can be attributed to consuming applications.
  - name: Optimization
    description: Right-size core counts for self-managed Akka clusters; use elastic scaling on Akka Serverless;
      adopt committed-use contracts for steady-state workloads to capture volume discounts and multi-cloud
      credit flexibility.
  - name: Accountability
    description: Establish budget owners per Akka cluster or Serverless tenant; integrate Akka invoices
      into chargeback/showback workflows alongside underlying cloud spend.
