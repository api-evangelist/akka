description: 'FOCUS-aligned FinOps for Akka: per-core annual subscriptions for self-managed Akka SDK and
  Akka Libraries, per-Akka-hour metered usage for Akka Serverless, and per-region subscriptions for in-VPC
  deployments. Committed-use contracts unlock volume discounts and multi-cloud credits.'
